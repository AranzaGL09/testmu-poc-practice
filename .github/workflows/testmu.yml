name: TestMu Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  selenium-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Execute Tests
        run: |
          mvn test \
          -DEXECUTION_TARGET=testmu \
          -DLT_USERNAME=${{ secrets.LT_USERNAME }} \
          -DLT_ACCESS_KEY=${{ secrets.LT_ACCESS_KEY }} \
          -DLT_PROJECT=testmu-poc-practice \
          -DLT_BUILD_NAME=GitHub-Build

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/**
            artifacts/**