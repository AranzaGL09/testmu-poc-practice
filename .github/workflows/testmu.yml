name: TestMu Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  selenium-tests:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Execute Tests
        run: mvn test

      - name: Upload Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/**
            artifacts/**